name: Selenium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest selenium webdriver-manager pytest-html

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Setup application
      run: |
        mkdir -p app
        if [ -f "index.html" ]; then
          cp index.html app/
        fi
        if [ -f "index-BUH56GOL.js" ]; then
          cp index-BUH56GOL.js app/
        fi
        if [ -f "index-Dy9zO9yl.css" ]; then
          cp index-Dy9zO9yl.css app/
        fi
        ls -la app/

    - name: Start server
      run: |
        cd app
        python3 -m http.server 8000 &
        sleep 3
        curl -s http://localhost:8000/ | head -n 5

    - name: Run tests
      run: |
        sleep 2
        pytest tests/ -v --tb=short --html=report.html
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          report.html
          screenshots/
          app/
